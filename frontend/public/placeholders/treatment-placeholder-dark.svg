<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <!-- Paleta Dark: Antracita Nocturno, Obsidiana y Oro Cálido -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="50%" stop-color="#121110" />
      <stop offset="100%" stop-color="#0A0908" />
    </linearGradient>

    <radialGradient id="darkHalo" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#1A1816" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A0908" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="waveDark1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#8C7322" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#181716" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="waveDark2" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#262320" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1A1816" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0D0C0B" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldStrokeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C868" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A6841C" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Fondo base oscuro -->
  <rect width="800" height="1000" fill="url(#bgDark)" />
  <circle cx="400" cy="420" r="450" fill="url(#darkHalo)" />

  <!-- Formas orgánicas de obsidiana y terciopelo -->
  <path d="M-60,350 C120,280 260,490 480,410 C680,330 760,180 860,220 L860,1050 L-60,1050 Z" fill="url(#waveDark2)" />
  
  <path d="M-80,520 C180,420 320,680 580,560 C740,480 820,530 880,590 L880,1050 L-80,1050 Z" fill="url(#waveDark1)" />

  <path d="M-50,680 C140,610 290,790 520,720 C710,660 780,740 850,780 L850,1050 L-50,1050 Z" fill="#151413" fill-opacity="0.65" />

  <!-- Líneas luminosas de oro líquido -->
  <path d="M-60,350 C120,280 260,490 480,410 C680,330 760,180 860,220" fill="none" stroke="url(#goldStrokeDark)" stroke-width="1.6" stroke-dasharray="6 3" opacity="0.5" />

  <path d="M-80,520 C180,420 320,680 580,560 C740,480 820,530 880,590" fill="none" stroke="url(#goldStrokeDark)" stroke-width="2.2" />

  <path d="M-50,680 C140,610 290,790 520,720 C710,660 780,740 850,780" fill="none" stroke="url(#goldStrokeDark)" stroke-width="1.3" opacity="0.35" />

  <!-- Halo de armonía sutil -->
  <circle cx="400" cy="500" r="90" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.22" />
  <circle cx="400" cy="500" r="140" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 4" stroke-opacity="0.14" />
</svg>
